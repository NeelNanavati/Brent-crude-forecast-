name: Deploy Shiny App

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R Packages
        run: |
          install.packages(c("rsconnect", "shiny", "plotly", "tidyverse", "forecast", "rugarch"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Deploy to shinyapps.io
        env:
          ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          rsconnect::setAccountInfo(name = Sys.getenv("ACCOUNT"), token = Sys.getenv("TOKEN"), secret = Sys.getenv("SECRET"))
          rsconnect::deployApp(appName = "brent_project", forceUpdate = TRUE)
        shell: Rscript {0}
